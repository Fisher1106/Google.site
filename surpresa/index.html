<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#30172c">
<title>Uma surpresa só para você ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 5%,#a65c7b 0,transparent 45%),radial-gradient(circle at 90% 95%,#87496f 0,transparent 45%),#30172c;color:#58273c}
.card{width:min(100%,400px);background:linear-gradient(140deg,#fffaf9,#ffe4eb);border-radius:30px;padding:36px 27px;box-shadow:0 30px 80px #19091299;text-align:center;animation:appear .8s ease both}
.tag{display:inline-block;border-radius:30px;padding:9px 15px;background:#fbd3e1;color:#a34268;font-size:12px;font-weight:700;letter-spacing:.04em}
.heart{font-size:76px;display:block;margin:20px auto;filter:drop-shadow(0 8px 10px #e46b8355);animation:beat 1.8s infinite}
h1{font-size:28px;line-height:1.18;margin:8px 0 24px}p{font-size:17px;line-height:1.65;margin:0 0 17px}
.love{font-size:26px;font-weight:800;color:#bf3f70;margin:25px 0 14px}
.small{font-size:12px;color:#a46b80;margin:22px 0 0}
@keyframes appear{from{transform:translateY(22px) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.13)}45%{transform:scale(1.02)}}
@media(prefers-reduced-motion:reduce){.card,.heart{animation:none}}
</style>
</head>
<body><main class="card">
<div class="tag">💌 UMA MENSAGEM ESPECIAL</div>
<span class="heart">❤️</span>
<h1>Tenho uma surpresa para você!</h1>
<p>Só passei para lembrar que você é muito especial para mim.</p>
<p>Obrigado por fazer parte da minha vida e deixar meus dias mais bonitos.</p>
<div class="love">Eu te amo! ❤️</div>
<div class="small">Feito com carinho, só para você ✨</div>
</main></body></html>
